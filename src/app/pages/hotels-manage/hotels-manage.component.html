<div class="d-flex" style="height: 100vh;">
  <!-- Sidebar -->
  <app-sidebar [role]="'ADMIN'"></app-sidebar>

  <!-- Main Content -->
  <div class="flex-grow-1 overflow-auto bg-light">
    <div class="p-5">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Manage Hotels</h2>
        <button class="btn btn-primary" (click)="openForm()" [disabled]="showForm">
          <i class="bi bi-plus-lg me-2"></i>Add New Hotel
        </button>
      </div>

      <!-- Filters -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Search by name or location..." 
                 [(ngModel)]="searchTerm">
        </div>
        <div class="col-md-6">
          <select class="form-select" [(ngModel)]="filterStatus">
            <option value="all">All Hotels</option>
            <option value="active">Active Only</option>
            <option value="inactive">Inactive Only</option>
          </select>
        </div>
      </div>

      <!-- Form Modal -->
      <div *ngIf="showForm" class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-header bg-primary text-white rounded-4">
          <h5 class="fw-bold m-0">{{ editingId ? 'Edit' : 'Add' }} Hotel</h5>
        </div>
        <div class="card-body p-4">
          <form [formGroup]="hotelForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Hotel Name *</label>
                <input type="text" class="form-control" formControlName="name" 
                       placeholder="Enter hotel name">
                <div class="invalid-feedback d-block" *ngIf="hotelForm.get('name')?.invalid && hotelForm.get('name')?.touched">
                  Name is required
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Location *</label>
                <input type="text" class="form-control" formControlName="location"
                       placeholder="Enter location">
              </div>
              <div class="col-12">
                <label class="form-label">Description *</label>
                <textarea class="form-control" formControlName="description" rows="3"
                          placeholder="Enter hotel description"></textarea>
              </div>
              <div class="col-md-8">
                <label class="form-label">Image URL</label>
                <input type="url" class="form-control" formControlName="imageUrl"
                       placeholder="Enter image URL or upload">
              </div>
              <div class="col-md-4">
                <label class="form-label">Upload Image</label>
                <input type="file" class="form-control" accept="image/*" 
                       (change)="handleImageUpload($event)">
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive">
                  <label class="form-check-label" for="isActive">
                    Hotel is Active
                  </label>
                </div>
              </div>
              <div class="col-12">
                <button type="button" class="btn btn-success me-2" (click)="saveHotel()" 
                        [disabled]="hotelForm.invalid">
                  <i class="bi bi-check-lg me-2"></i>Save
                </button>
                <button type="button" class="btn btn-secondary" (click)="closeForm()">
                  <i class="bi bi-x-lg me-2"></i>Cancel
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Hotels Table -->
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-0">
          <div *ngIf="isLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div class="table-responsive" *ngIf="!isLoading">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="ps-4">Hotel Name</th>
                  <th scope="col">Location</th>
                  <th scope="col">Status</th>
                  <th scope="col">Image</th>
                  <th scope="col" class="pe-4">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let hotel of filteredHotels">
                  <td class="ps-4 fw-semibold">{{ hotel.name }}</td>
                  <td>{{ hotel.location }}</td>
                  <td>
                    <span class="badge" [ngClass]="hotel.isActive ? 'bg-success' : 'bg-danger'">
                      {{ hotel.isActive ? 'Active' : 'Inactive' }}
                    </span>
                  </td>
                  <td>
                    <img *ngIf="hotel.imageUrl" [src]="hotel.imageUrl" 
                         class="img-thumbnail" style="max-width: 50px;">
                    <span *ngIf="!hotel.imageUrl" class="text-muted">No image</span>
                  </td>
                  <td class="pe-4">
                    <button class="btn btn-sm btn-warning me-1" (click)="openForm(hotel)">
                      <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-info me-1" 
                            (click)="toggleStatus(hotel)">
                      <i class="bi bi-toggle-on"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" (click)="deleteHotel(hotel.hotelId || 0)">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
                <tr *ngIf="filteredHotels.length === 0">
                  <td colspan="5" class="text-center py-4 text-muted">
                    No hotels found
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
