<div class="auth-container d-flex align-items-center justify-content-center">
  <div class="auth-card card shadow-lg border-0 rounded-4">
    <div class="row g-0">
      
      <!-- Form Side -->
      <div class="col-md-6 order-2 order-md-1">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-0">Create an Account</h3>
            <p class="text-muted">Join us to book your perfect stay</p>
          </div>

          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="username" placeholder="Username" formControlName="username" [ngClass]="{'is-invalid': registerForm.get('username')?.invalid && registerForm.get('username')?.touched}">
              <label for="username"><i class="bi bi-person me-2"></i>Username</label>
              <div class="invalid-feedback">Username is required (min 4 characters).</div>
            </div>

            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" placeholder="Email" formControlName="email" [ngClass]="{'is-invalid': registerForm.get('email')?.invalid && registerForm.get('email')?.touched}">
              <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
              <div class="invalid-feedback">A valid email is required.</div>
            </div>




            <div class="form-floating mb-4">
              <input type="password" class="form-control" id="password" placeholder="Password" formControlName="password" [ngClass]="{'is-invalid': registerForm.get('password')?.invalid && registerForm.get('password')?.touched}">
              <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
              <div class="invalid-feedback">Password is required (min 6 characters).</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5 mb-3" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Sign Up
            </button>
            
          </form>
          
          <div class="text-center mt-3">
            <p class="text-muted mb-0">Already have an account? <a routerLink="/login" class="text-primary text-decoration-none fw-bold">Sign in</a></p>
          </div>
          
        </div>
      </div>

      <!-- Image Side -->
      <div class="col-md-6 d-none d-sm-block p-0 order-1 order-md-2">
        <img src="https://picsum.photos/seed/luxuryhotel/800/1200" alt="Luxury Hotel" class="img-fluid rounded-end-4 h-100 w-100" style="object-fit: cover; min-height: 500px;">
      </div>

    </div>
  </div>
</div>
