<app-navbar></app-navbar>
<div class="auth-container d-flex align-items-center justify-content-center">
  <div class="auth-card card shadow-lg border-0 rounded-4">
    <div class="row g-0">
      <!-- Image Side -->
      <div class="col-md-6 d-none d-sm-block p-0">
        <img src="https://picsum.photos/seed/luxuryhotel/800/1200" alt="Luxury Hotel" class="img-fluid rounded-start-4 h-100 w-100" style="object-fit: cover; min-height: 400px;">
      </div>
      <!-- Form Side -->
      <div class="col-md-6">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-0">Welcome Back!</h3>
            <p class="text-muted">Sign in to your account to continue</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="username" placeholder="Username" formControlName="username" [ngClass]="{'is-invalid': loginForm.get('username')?.invalid && loginForm.get('username')?.touched}">
              <label for="username"><i class="bi bi-person me-2"></i>Username</label>
              <div class="invalid-feedback">Username is required.</div>
            </div>

            <div class="form-floating mb-4">
              <input type="password" class="form-control" id="password" placeholder="Password" formControlName="password" [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
              <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
              <div class="invalid-feedback">Password is required.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5 mb-3" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Sign In
            </button>
            
          </form>
          
          <div class="text-center mt-3">
            <p class="text-muted mb-0">Don't have an account? <a routerLink="/register" class="text-primary text-decoration-none fw-bold">Sign up</a></p>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</div>
