<div class="d-flex flex-column flex-shrink-0 p-3 theme-sidebar h-100" style="width: 280px;">

  <!-- Admin Links -->
  <ul class="nav nav-pills flex-column mb-auto" *ngIf="role === 'ADMIN'">
    <li class="nav-item">
      <a routerLink="/admin" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/hotels-manage" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-building me-2"></i> Hotels
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/rooms-manage" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-door-open me-2"></i> Rooms
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/bookings-manage" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-calendar-check me-2"></i> Bookings
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/payments-manage" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-cash-coin me-2"></i> Payments
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/reviews" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-star-fill me-2"></i> Reviews
      </a>
    </li>
  </ul>

  <!-- User Links -->
  <ul class="nav nav-pills flex-column mb-auto" *ngIf="role === 'USER'">
    <li class="nav-item">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-calendar2-check me-2"></i> My Bookings
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/profile" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-person me-2"></i> My Profile
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/reviews" routerLinkActive="active" class="nav-link fw-semibold mb-1">
        <i class="bi bi-star-fill me-2"></i> My Reviews
      </a>
    </li>
  </ul>

  <hr>
  <div class="dropdown">
    <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle px-2" data-bs-toggle="dropdown" aria-expanded="false">
      <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
        <i class="bi bi-person-fill"></i>
      </div>
      <strong>{{ displayName }}</strong>
    </a>
    <ul class="dropdown-menu text-small shadow">
      <li><a class="dropdown-item" routerLink="/profile"><i class="bi bi-person me-2"></i>My Profile</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item text-danger" href="javascript:void(0)" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
    </ul>
  </div>
</div>
