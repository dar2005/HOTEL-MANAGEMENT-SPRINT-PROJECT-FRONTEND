<nav class="navbar navbar-expand-lg navbar-dark fixed-top px-4 py-2 bg-primary shadow-sm">
  <div class="container-fluid">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <i class="bi bi-compass fs-4 me-2"></i><span class="fs-4 fw-bold" style="letter-spacing: 1px;">Horizon</span>
    </a>

    <!-- Mobile Toggle Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Links and Right Menu -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <!-- Center Links -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link text-white px-3" routerLink="/" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white px-3" routerLink="/hotels" routerLinkActive="active">Hotels</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white px-3" routerLink="/rooms" routerLinkActive="active">Rooms</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white px-3" routerLink="/reviews" routerLinkActive="active">Reviews</a>
        </li>
        
        <!-- Authenticated Center Links -->
        <ng-container *ngIf="isAuthenticated$ | async">
          <li class="nav-item">
            <a class="nav-link text-white px-3 fw-bold" routerLink="/dashboard" routerLinkActive="active">My Bookings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white px-3 fw-bold" routerLink="/dashboard" routerLinkActive="active">Payment</a>
          </li>
        </ng-container>
      </ul>

      <!-- Right Action Items -->
      <div class="d-flex align-items-center gap-4 mt-3 mt-lg-0">

        <!-- Unauthenticated Links -->
        <ng-container *ngIf="(isAuthenticated$ | async) === false">
          <a class="nav-link text-white" routerLink="/login">Login</a>
          <a class="btn btn-light text-primary fw-bold btn-sm px-3" routerLink="/register">Register</a>
        </ng-container>

        <!-- Authenticated Links -->
        <ng-container *ngIf="isAuthenticated$ | async">
          <a class="nav-link text-white" routerLink="/dashboard"><i class="bi bi-person-circle me-1"></i>My Profile</a>
          <button class="btn btn-outline-light btn-sm px-3" (click)="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
        </ng-container>

      </div>
    </div>
  </div>
</nav>
